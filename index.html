<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trawley Coin</title>
  <meta name="description" content="The Trawley family chore currency.">
  <meta name="theme-color" content="#f5a623">
  <link rel="icon" href="icons/kid.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .pick .t, .pick .d { display: block; }
  </style>
</head>
<body>
  <div class="landing">
    <div class="logo">🪙</div>
    <h1>Trawley Coin</h1>
    <p>The family chore currency.<br>Pick your app — then install it to your home screen.</p>
    <a class="pick" href="parent/">
      <span class="ico">🧑‍💼</span>
      <span>
        <span class="t">Parent app</span>
        <span class="d">Approve chores, choose coin amounts, manage the bank</span>
      </span>
    </a>
    <a class="pick" href="kid/">
      <span class="ico">🧒</span>
      <span>
        <span class="t">Kid app</span>
        <span class="d">See your coins and tell your parent about chores you did</span>
      </span>
    </a>
  </div>
</body>
</html>
